<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<title>九万亩 · 控制台</title>
<meta name="description" content="九万亩脚本的控制台：启停脚本、查看运行状态与实时日志。">
<style>
  /* ============================================================
     与开荒地图页同一套语言（DESIGN-claude.md）：
     暖米色画布、衬线标题、珊瑚主色、深色产品面。
     这里的「深色面」给海洋窗和日志窗用。
     ============================================================ */
  :root {
    color-scheme: light;

    --primary: #cc785c;
    --primary-active: #a9583e;
    --primary-disabled: #e6dfd8;

    --ink: #141413;
    --body: #3d3d3a;
    --body-strong: #252523;
    --muted: #6c6a64;
    --muted-soft: #8e8b82;

    --canvas: #faf9f5;
    --surface-soft: #f5f0e8;
    --surface-card: #efe9de;
    --surface-dark: #181715;
    --surface-dark-elevated: #252320;
    --on-dark: #faf9f5;
    --on-dark-soft: #a09d96;

    --hairline: #e6dfd8;
    --hairline-soft: #ebe6df;

    --success: #5db872;
    --warning: #d4a017;
    --error: #c64545;

    --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
    --s-5: 24px; --s-6: 32px; --s-7: 48px;

    --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-full: 9999px;

    --font-display: "Cormorant Garamond", "Tiempos Headline", "Songti SC", "SimSun", Georgia, serif;
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

    --fast: 130ms;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    /* 底色和引擎画布同色（#f4efe5）：鲨鱼是纸上的一层墨，不是一块深色面板 */
    background: #f4efe5;
    color: var(--body);
    font: 400 15px/1.55 var(--font-sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* 全屏固定的画布：滚动时鲨鱼还在（不是页面上的一条横带） */
  #ocean {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    z-index: 0;
    font-family: var(--font-mono);
  }
  #ocean.hidden-bg { display: none; }
  main {
    position: relative; z-index: 1;
    max-width: 1080px; margin: 0 auto;
    padding: var(--s-6) var(--s-5) var(--s-7);
  }

  h1, h2 {
    font-family: var(--font-display);
    font-weight: 400;
    color: var(--ink);
    margin: 0;
  }
  h1 { font-size: 36px; line-height: 1.15; letter-spacing: -.5px; color: var(--ink); }
  h2 { font-size: 22px; line-height: 1.2; letter-spacing: -.3px; margin-bottom: var(--s-3); }
  p { margin: 0; }

  :where(button, a, [tabindex]):focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  /* ---------- 页头 ---------- */
  header {
    display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-4);
    padding-bottom: var(--s-5); margin-bottom: var(--s-5);
    border-bottom: 1px solid #c9c0b0;
  }
  #url { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  /* ---------- 页脚署名：压在海洋上的一行小字 ---------- */
  .credit {
    position: relative; z-index: 1;
    max-width: 1080px; margin: 0 auto;
    padding: 0 var(--s-5) var(--s-5);
    color: var(--muted-soft);
    font: 500 11px/1.4 var(--font-sans);
    letter-spacing: 1.3px; text-transform: uppercase;
    text-align: right;
  }
  .credit a { color: var(--muted); text-decoration: none; }
  .credit a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }

  /* ---------- 卡片 ---------- */
  .grid { display: grid; gap: var(--s-4); }
  /* 半透明玻璃卡：能看见后面游的鲨鱼，但文字仍然清楚。
     rgba 的 0.70 是量过的 —— 米色叠在 #0d0c0b 上约等效 #b3b2ae，
     正文 #141413 对比度仍有 ~7:1，高于 AA 的 4.5。 */
  .panel {
    /* 不做背景模糊：ASCII 点阵一糊就成脏斑。
       这里就是纯半透明白，让底下的墨色字符原样透上来 —— 透得干净，不是糊得发灰。 */
    background: rgba(255, 253, 247, .58);
    border: 1px solid #ffffffA6;
    border-radius: var(--r-lg);
    padding: var(--s-6);
    box-shadow: 0 24px 48px -38px #3a342B4D;
  }
  .panel.soft { background: var(--surface-soft); border-color: transparent; }

  .row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }

  /* ---------- 状态 ---------- */
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted-soft);
    transition: background var(--fast) var(--ease);
  }
  .dot.on { background: var(--success); box-shadow: 0 0 0 4px #5db87226; }
  .dot.off { background: var(--muted-soft); }

  .status {
    font-family: var(--font-display);
    font-size: 24px; font-weight: 500; letter-spacing: -.2px;
    color: var(--ink);
  }
  .status.on { color: #2f7a48; }
  .status.off { color: #55534e; }

  .kv {
    display: flex; gap: var(--s-4); flex-wrap: wrap;
    /* 玻璃卡把底色拉暗了：面板里的次要文字要比 --muted 更深一档，
       否则 rgba(.70) 的等效底 (#b3b2ae) 上只有 2.6:1。 */
    color: #403e3a; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 按钮 ---------- */
  button {
    background: var(--canvas);
    color: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    min-height: 40px;
    padding: 10px var(--s-5);
    font: 500 14px/1 var(--font-sans);
    white-space: nowrap;
    cursor: pointer;
    transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  button:hover:not(:disabled) { background: var(--surface-soft); }
  button:active:not(:disabled) { background: var(--surface-card); }
  button:disabled { color: var(--muted-soft); background: var(--surface-soft); border-color: var(--hairline-soft); cursor: default; }
  /* 主操作：全页唯一的珊瑚填充 */
  button.primary { background: var(--primary); border-color: var(--primary); color: #ffffff; }
  button.primary:hover:not(:disabled) { background: var(--primary-active); border-color: var(--primary-active); }
  button.primary:disabled { background: var(--primary-disabled); border-color: var(--primary-disabled); color: var(--muted); }
  /* 危险操作：只描边，不填充 —— 免得和主操作抢注意力 */
  button.danger { color: var(--error); border-color: #c6454559; background: var(--canvas); }
  button.danger:hover:not(:disabled) { background: #c645450f; border-color: var(--error); }
  button.danger:disabled { color: var(--muted-soft); border-color: var(--hairline-soft); background: var(--canvas); }

  a.link {
    color: var(--primary); text-decoration: none; font-weight: 500;
  }
  a.link:hover { color: var(--primary-active); text-decoration: underline; text-underline-offset: 2px; }

  .hint { color: #403e3a; font-size: 14px; margin-top: var(--s-4); line-height: 1.65; }

  /* ---------- 日志窗：深色代码面 ---------- */
  /* 日志卡：整块透明 —— 没有底、没有边、没有投影，只有标题和文字浮在纸上 */
  .log-card {
    /* 仍然不是卡片：没有边框、没有圆角、没有投影。
       只是一块「纸被擦白了一点」的区域 —— 上下渐隐，看不出边界。
       不这么做的话，鲨鱼游过日志就会把字压糊（ASCII 纹理和等宽文字叠一起没法读）。 */
    background: linear-gradient(180deg,
      rgba(250, 248, 242, 0) 0%,
      rgba(250, 248, 242, .90) 5%,
      rgba(250, 248, 242, .94) 92%,
      rgba(250, 248, 242, 0) 100%);
    border-color: transparent;
    box-shadow: none;
    padding-left: var(--s-3);
    padding-right: var(--s-3);
  }
  .log-card h2 { color: var(--ink); }
  .log-card .meta { color: var(--muted); font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; }
  pre {
    margin: var(--s-2) 0 0;
    padding: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
    font: 400 12.5px/1.75 var(--font-mono);
    color: #3a352e;
    -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent 100%);
    white-space: pre-wrap;
    word-break: break-all;
  }

  @media (max-width: 640px) {
    main { padding: var(--s-5) var(--s-4) var(--s-6); }
    h1 { font-size: 28px; }
    header { flex-direction: column; align-items: start; gap: var(--s-2); }
    .ocean { height: 180px; }
    .panel { padding: var(--s-4); }
    button { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<canvas id="ocean" aria-hidden="true"></canvas>
<main>
  <header>
    <h1>九万亩 · 控制台</h1>
    <p id="url"></p>
  </header>

  <div class="grid">
    <section class="panel">
      <div class="row" style="margin-bottom:16px">
        <span class="dot off" id="dot"></span>
        <span class="status off" id="statusText">未运行</span>
        <span class="kv" id="meta"></span>
      </div>
      <div class="row">
        <button class="primary" id="startBtn">启动脚本</button>
        <button class="danger" id="stopBtn" disabled>停止脚本</button>
        <a class="link" id="openApp" href="#" target="_blank" style="margin-left:auto">打开开荒地图 →</a>
      </div>
      <p class="hint">
        启动后脚本会接管模拟器。不玩的时候点「停止脚本」，后台就只剩这个控制台，不占 CPU、不截图。
      </p>
    </section>

    <section class="panel log-card">
      <h2>运行日志</h2>
      <p class="meta">最新 18 行 · 每 2 秒刷新</p>
      <pre id="log">等待启动…</pre>
    </section>
  </div>
</main>
<p class="credit">
  ascii sharks · <a href="https://github.com/stackedlol/ascii-sharks" target="_blank" rel="noopener">stackedlol/ascii-sharks</a> · MIT
</p>

<script src="ascii-sharks.bundle.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let busy = false;
  const fmt = s => {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (h ? h + " 小时 " : "") + (h || m ? m + " 分 " : "") + sec + " 秒";
  };
  function render(s) {
    const on = s.running;
    $("dot").className = "dot " + (on ? "on" : "off");
    $("statusText").className = "status " + (on ? "on" : "off");
    $("statusText").textContent = on ? "正在运行" : "未运行";
    $("meta").textContent = on
      ? "PID " + s.pid + " · 已运行 " + fmt(s.uptime)
      : "脚本已停止，后台只有控制台";
    $("startBtn").disabled = busy || on;
    $("stopBtn").disabled = busy || !on;
    // 开荒地图走控制台的 /map/ 代理：用户只记 8765 一个地址
    $("openApp").style.display = on ? "" : "none";
    // 带版本号，避免浏览器沿用旧页面脚本（旧脚本会在初始化时抛错、永远显示离线）
    if (on) $("openApp").href = "/map/?v=16";
    // 只留最新的十几行：这块不滚动了，多了会把页面撑长
    if (s.log && s.log.length) {
      const LOG_LINES = 18;
      $("log").textContent = s.log.slice(-LOG_LINES).join("\n");
    }
  }
  async function post(path) {
    if (busy) return;
    busy = true;
    try {
      const r = await fetch(path, { method: "POST" });
      const data = await r.json();
      render(data);
      if (data.message) $("statusText").textContent = data.message;
    } catch (e) {
      $("statusText").textContent = "操作失败：" + e.message;
    } finally {
      busy = false;
    }
  }
  $("startBtn").onclick = () => post("start");
  $("stopBtn").onclick = () => {
    if (confirm("停止脚本？停止后模拟器不会被操作，后台只留控制台。")) post("stop");
  };
  async function poll() {
    try {
      const r = await fetch("state", { cache: "no-store" });
      render(await r.json());
    } catch (e) { /* 控制台还在，失败就下轮再试 */ }
  }
  $("url").textContent = location.origin + location.pathname;
  poll();
  setInterval(poll, 2000);

  /* ---------- 海洋：ascii-sharks 的画布引擎 ---------- */
  (function startOcean() {
    const canvas = $("ocean");
    const Engine = window.AsciiSharks && window.AsciiSharks.OceanEngine;
    // 引擎自己处理 prefers-reduced-motion 与「离屏暂停」；没加载上就把画布藏掉，
    // 露出下面的深色底，不会是一块白。
    if (!Engine) { canvas.classList.add("hidden-bg"); return; }
    try {
      new Engine(canvas, [
        { kind: "classic", size: 1 },
        { kind: "hammerhead", size: 0.82 },
        { kind: "mako", size: 0.66 },
        { kind: "thresher", size: 0.72 },
      ]);
    } catch (e) {
      canvas.classList.add("hidden-bg");
      console.warn("ascii-sharks 启动失败：", e);
    }
  })();
</script>
</body>
</html>
