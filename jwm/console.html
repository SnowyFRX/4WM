<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九万亩 · 控制台</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0B0D12; --bg-soft:#10141B;
    --surface:#151A22; --surface-2:#1A2029; --surface-3:#222A36; --surface-4:#2A3441;
    --stroke:#232B37; --stroke-hi:#354052;
    --ink:#EDF1F7; --ink-2:#9AA6B8; --ink-3:#626E80;
    --primary:#4C8DFF; --primary-soft:#4C8DFF1F;
    --green:#3DDC97; --amber:#F2B45A; --red:#F16A76;
    --purple:#A78BFA; --cyan:#57D3E8;
    --shadow: 0 1px 0 #FFFFFF08 inset, 0 14px 32px -20px #000000CC;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:
      radial-gradient(1000px 480px at 10% -10%, #1D2A44 0%, transparent 60%),
      radial-gradient(900px 440px at 100% 0%, #16283A 0%, transparent 56%),
      var(--bg);
    background-attachment:fixed; color:var(--ink);
    font:14px/1.6 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased; }
  main { max-width:min(96vw,1180px); margin:auto; padding:28px 26px 52px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:14px;
    padding-bottom:16px; margin-bottom:20px; border-bottom:1px solid var(--stroke); }
  h1 { margin:0; font-size:25px; font-weight:650; letter-spacing:.2px;
    background:linear-gradient(92deg,#FFFFFF 0%,#BBD3FF 55%,#8FB6FF 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { margin:0 0 10px; font-size:13px; font-weight:650; letter-spacing:.5px; }
  p { margin:0; }
  .muted { color:var(--ink-2); font-size:12.5px; }
  .panel { background:linear-gradient(180deg,var(--surface) 0%,var(--bg-soft) 100%);
    border:1px solid var(--stroke); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .grid { display:grid; gap:16px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--ink-3); transition:background .2s; }
  .dot.on { background:var(--green); box-shadow:0 0 12px var(--green); animation:pulse 1.8s ease-in-out infinite; }
  .dot.off { background:var(--ink-3); }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.42;transform:scale(.82);} }
  .status { font-size:16px; font-weight:650; letter-spacing:.2px; }
  .status.on { color:var(--green); }
  .status.off { color:var(--ink-3); }
  button { background:linear-gradient(180deg,var(--surface-3) 0%,var(--surface-2) 100%);
    color:var(--ink); border:1px solid var(--stroke-hi);
    border-radius:10px; padding:9px 20px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    transition:background .16s,border-color .16s,transform .08s; }
  button:hover:not(:disabled) { background:linear-gradient(180deg,var(--surface-4) 0%,var(--surface-3) 100%);
    border-color:#445069; }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { color:var(--ink-3); background:var(--surface-2); border-color:var(--stroke); cursor:default; }
  button.primary { background:linear-gradient(180deg,#4FE7A6 0%,var(--green) 100%);
    border-color:transparent; color:#05130C; box-shadow:0 8px 20px -12px #3DDC97CC; }
  button.primary:hover:not(:disabled) { background:linear-gradient(180deg,#63F2B7 0%,#43E6A3 100%); }
  button.primary:disabled { background:#1B2A24; color:#4A6558; box-shadow:none; }
  button.danger { background:transparent; color:var(--red); border-color:#4A2A30; }
  button.danger:hover:not(:disabled) { background:#2A1A1E; border-color:#6B3A42; }
  button.danger:disabled { color:var(--ink-3); border-color:var(--stroke); background:transparent; }
  pre { margin:0; padding:13px 15px; background:#0D1117; border:1px solid var(--stroke);
    border-radius:12px; font:12px/1.65 "Cascadia Mono",Consolas,monospace; color:#A9B6C9;
    max-height:430px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .kv { display:flex; gap:18px; flex-wrap:wrap; color:var(--ink-2); font-size:12.5px;
    font-variant-numeric:tabular-nums; }
  a.link { color:#8FB8FF; text-decoration:none; font-weight:600; }
  a.link:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <header>
    <h1>九万亩 · 控制台</h1>
    <p class="muted" id="url"></p>
  </header>

  <div class="grid">
    <section class="panel">
      <div class="row" style="margin-bottom:14px">
        <span class="dot off" id="dot"></span>
        <span class="status off" id="statusText">未运行</span>
        <span class="kv" id="meta"></span>
      </div>
      <div class="row">
        <button class="primary" id="startBtn">启动脚本</button>
        <button class="danger" id="stopBtn" disabled>停止脚本</button>
        <a class="link" id="openApp" href="#" target="_blank" style="margin-left:auto">打开开荒地图 →</a>
      </div>
      <p class="muted" style="margin-top:12px">
        启动后脚本会接管模拟器。不玩的时候点「停止脚本」，后台就只剩这个控制台，不占 CPU、不截图。
      </p>
    </section>

    <section class="panel">
      <h2>运行日志</h2>
      <pre id="log">等待启动…</pre>
    </section>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  let busy = false;
  const fmt = s => {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (h ? h + " 小时 " : "") + (h || m ? m + " 分 " : "") + sec + " 秒";
  };
  function render(s) {
    const on = s.running;
    $("dot").className = "dot " + (on ? "on" : "off");
    $("statusText").className = "status " + (on ? "on" : "off");
    $("statusText").textContent = on ? "正在运行" : "未运行";
    $("meta").textContent = on
      ? "PID " + s.pid + " · 已运行 " + fmt(s.uptime)
      : "脚本已停止，后台只有控制台";
    $("startBtn").disabled = busy || on;
    $("stopBtn").disabled = busy || !on;
    // 开荒地图走控制台的 /map/ 代理：用户只记 8765 一个地址
    $("openApp").style.display = on ? "" : "none";
    // 带版本号，避免浏览器沿用旧页面脚本（旧脚本会在初始化时抛错、永远显示离线）
    if (on) $("openApp").href = "/map/?v=16";
    if (s.log && s.log.length) $("log").textContent = s.log.join("\n");
  }
  async function post(path) {
    if (busy) return;
    busy = true;
    try {
      const r = await fetch(path, { method: "POST" });
      const data = await r.json();
      render(data);
      if (data.message) $("statusText").textContent = data.message;
    } catch (e) {
      $("statusText").textContent = "操作失败：" + e.message;
    } finally {
      busy = false;
    }
  }
  $("startBtn").onclick = () => post("start");
  $("stopBtn").onclick = () => {
    if (confirm("停止脚本？停止后模拟器不会被操作，后台只留控制台。")) post("stop");
  };
  async function poll() {
    try {
      const r = await fetch("state", { cache: "no-store" });
      render(await r.json());
    } catch (e) { /* 控制台还在，失败就下轮再试 */ }
  }
  $("url").textContent = location.origin + location.pathname;
  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
